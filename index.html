<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCell — Bản đồ user</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    :root { --ink: #1c2430; --muted: #667085; --line: #e6eaf0; --online: #067647; --offline: #98a2b3; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
    header {
      height: 52px;
      background: #0e3b2e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 12px;
    }
    header strong { font-size: 16px; }
    nav { display: flex; gap: 14px; }
    nav a { color: #d7efe4; text-decoration: none; font-size: 14px; font-weight: 600; }
    nav a[aria-current] { color: #fff; }
    #wrap { height: calc(100% - 52px); display: flex; }
    aside {
      width: 320px;
      border-right: 1px solid var(--line);
      background: #fff;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .tools { padding: 10px; border-bottom: 1px solid var(--line); }
    .tools input, .tools select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .counts { display: flex; gap: 8px; font-size: 12px; color: var(--muted); }
    .counts b { color: var(--ink); }
    .measure-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .measure-row button {
      flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 8px;
      padding: 8px; cursor: pointer; font-size: 13px;
    }
    .measure-row button.on { background: #c2410c; color: #fff; border-color: #c2410c; }
    #measureReadout { margin-top: 6px; font-size: 12px; color: var(--muted); min-height: 16px; }
    .seg-tip {
      background: #fff7ed; border: 1px solid #fdba74; color: #9a3412;
      font-weight: 700; box-shadow: none;
    }
    .tools label.stations { display: flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; }
    .station-dot { width: 9px; height: 9px; background: #1d4ed8; border: 1.5px solid #fff; transform: rotate(45deg); }
    .station-cluster {
      width: 28px; height: 28px; line-height: 26px; text-align: center; border-radius: 50%;
      background: #1d4ed8; color: #fff; border: 2px solid #fff; font-size: 11px; font-weight: 700;
    }
    #list { overflow: auto; flex: 1; min-height: 80px; }
    #detail {
      display: none; border-top: 1px solid var(--line); overflow: auto;
      max-height: 52%; padding: 10px 12px; background: #f8fafc;
    }
    #detail.show { display: block; }
    .user {
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #fff;
      padding: 10px 12px;
      cursor: pointer;
    }
    .user:hover, .user.active { background: #f3faf6; }
    .user b { display: block; font-size: 14px; }
    .user span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .on { background: var(--online); }
    .off { background: var(--offline); }
    #map { flex: 1; min-width: 0; background: #e7eef2; }
    .pin {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    .user-pop { font-size: 12px; line-height: 1.35; }
    .user-pop h3 { margin: 0 0 2px; font-size: 14px; }
    .user-pop .sec { margin: 8px 0 2px; font-size: 11px; font-weight: 700; color: #667085; }
    .user-pop .row { display: flex; justify-content: space-between; gap: 10px; }
    .user-pop .row span { color: #667085; }
    .user-pop .station { white-space: pre-wrap; margin-top: 2px; }
    .empty { padding: 16px; color: var(--muted); font-size: 13px; }
    @media (max-width: 800px) {
      #wrap { flex-direction: column; }
      aside { width: 100%; height: 42%; }
      #map { height: 58%; }
    }
  </style>
</head>
<body>
  <header>
    <strong>AutoCell</strong>
    <nav>
      <a href="index.html" aria-current="page">Bản đồ</a>
      <a href="users.html">User</a>
      <a href="about.html">Giới thiệu</a>
    </nav>
  </header>
  <div id="wrap">
    <aside>
      <div class="tools">
        <input id="q" placeholder="Tìm user, mạng, thiết bị…">
        <select id="filter">
          <option value="located">Có vị trí</option>
          <option value="online">Online</option>
          <option value="all">Tất cả</option>
          <option value="missing">Chưa có GPS</option>
        </select>
        <div class="counts">
          <span>Trên bản đồ <b id="nMap">0</b></span>
          <span>Online <b id="nOn">0</b></span>
          <span>Tổng <b id="nAll">0</b></span>
          <span>Trạm <b id="nStations">…</b></span>
        </div>
        <label class="stations"><input id="chkStations" type="checkbox" checked> Hiện trạm (cánh sóng khi phóng to)</label>
        <div class="measure-row">
          <button id="btnMeasure" type="button">Đo khoảng cách</button>
          <button id="btnAngle" type="button">Đo góc</button>
          <button id="btnClearMeasure" type="button">Xóa</button>
        </div>
        <div id="measureReadout">Bấm “Đo khoảng cách”, rồi chọn các điểm trên bản đồ.</div>
      </div>
      <div id="detail"></div>
      <div id="list"><div class="empty">Đang tải user…</div></div>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyCh9CZyZEXkwqievZYXEc8dua28kj0zqbc",
      authDomain: "autocell-ebacson.firebaseapp.com",
      databaseURL: "https://autocell-ebacson-default-rtdb.firebaseio.com",
      projectId: "autocell-ebacson",
      storageBucket: "autocell-ebacson.firebasestorage.app"
    });

    const ONLINE_MS = 30000;
    const $ = (id) => document.getElementById(id);
    const map = L.map("map").setView([16.2, 107.8], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    const cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 42 });
    map.addLayer(cluster);
    const stationCluster = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 48,
      iconCreateFunction: (c) => L.divIcon({
        className: "",
        iconSize: [28, 28],
        html: `<div class="station-cluster">${c.getChildCount()}</div>`
      })
    });
    const sectorLayer = L.layerGroup();
    const stationIcon = L.divIcon({
      className: "", iconSize: [12, 12], iconAnchor: [6, 6],
      html: `<div class="station-dot"></div>`
    });
    let stations = [];
    let showStations = true;

    function techColor(tech) {
      if (tech === "5G") return "#7c3aed";
      if (tech === "4G") return "#2563eb";
      if (tech === "3G") return "#d97706";
      return "#475467";
    }

    function destination(lat, lng, meters, bearingDeg) {
      const R = 6378137;
      const δ = meters / R;
      const θ = bearingDeg * Math.PI / 180;
      const φ1 = lat * Math.PI / 180;
      const λ1 = lng * Math.PI / 180;
      const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
      const λ2 = λ1 + Math.atan2(
        Math.sin(θ) * Math.sin(δ) * Math.cos(φ1),
        Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2)
      );
      return [φ2 * 180 / Math.PI, λ2 * 180 / Math.PI];
    }

    function sectorRing(lat, lng, azimuth, radius, sweep) {
      const start = azimuth - sweep / 2;
      const pts = [[lat, lng]];
      for (let i = 0; i <= 8; i++) pts.push(destination(lat, lng, radius, start + (sweep * i) / 8));
      pts.push([lat, lng]);
      return pts;
    }

    function redrawSectors() {
      sectorLayer.clearLayers();
      if (!showStations || map.getZoom() < 13) return;
      const bounds = map.getBounds().pad(0.2);
      stations.forEach((site) => {
        if (!bounds.contains([site.lat, site.lng])) return;
        site.cells.forEach((cell) => {
          L.polygon(sectorRing(site.lat, site.lng, cell.azimuth, 140, 60), {
            color: techColor(cell.tech),
            weight: 1,
            fillColor: techColor(cell.tech),
            fillOpacity: 0.28,
            interactive: false
          }).addTo(sectorLayer);
        });
      });
    }

    function loadStations(raw) {
      const groups = new Map();
      Object.entries(raw || {}).forEach(([id, cell]) => {
        if (!cell || typeof cell !== "object") return;
        const lat = Number(cell.lat);
        const lng = Number(cell.long);
        if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return;
        if (lat === 0 && lng === 0) return;
        const key = lat.toFixed(5) + "," + lng.toFixed(5);
        let site = groups.get(key);
        if (!site) {
          site = { lat, lng, node: cell.node || "", cells: [] };
          groups.set(key, site);
        }
        if (cell.node) site.node = String(cell.node);
        site.cells.push({
          name: cell.cellname || id,
          tech: cell.tech || "",
          azimuth: Number.isFinite(Number(cell.azimuth)) ? Number(cell.azimuth) : 0
        });
      });
      stations = [...groups.values()];
      $("nStations").textContent = stations.length;
      stationCluster.clearLayers();
      stations.forEach((site) => {
        const techs = [...new Set(site.cells.map((c) => c.tech).filter(Boolean))].join("/");
        const marker = L.marker([site.lat, site.lng], {
          icon: stationIcon,
          title: site.node || site.cells[0].name,
          zIndexOffset: -200
        });
        const lines = site.cells.slice(0, 8).map((c) =>
          `${esc(c.tech)} ${esc(c.name)} · ${c.azimuth}°`).join("<br>");
        const more = site.cells.length > 8 ? `<br>… ${site.cells.length - 8} cell nữa` : "";
        marker.bindPopup(
          `<b>${esc(site.node || "Trạm")}</b><br>${esc(techs)} · ${site.cells.length} cell<br>` +
          `${site.lat.toFixed(5)}, ${site.lng.toFixed(5)}<br>${lines}${more}`
        );
        stationCluster.addLayer(marker);
      });
      if (showStations) {
        if (!map.hasLayer(stationCluster)) map.addLayer(stationCluster);
        if (!map.hasLayer(sectorLayer)) map.addLayer(sectorLayer);
      }
      redrawSectors();
    }

    $("chkStations").onchange = () => {
      showStations = $("chkStations").checked;
      if (showStations) {
        map.addLayer(stationCluster);
        map.addLayer(sectorLayer);
      } else {
        map.removeLayer(stationCluster);
        map.removeLayer(sectorLayer);
      }
      redrawSectors();
    };
    map.on("moveend zoomend", redrawSectors);
    get(ref(getDatabase(app), "celldata")).then((snap) => loadStations(snap.val() || {}))
      .catch((err) => { $("nStations").textContent = "lỗi"; console.warn(err); });

    let measureMode = "";
    const measurePoints = [];
    const measureLine = L.polyline([], { color: "#c2410c", weight: 3, interactive: false }).addTo(map);
    const measureLayer = L.layerGroup().addTo(map);

    function fmtDist(meters) {
      if (meters < 1000) return Math.round(meters) + " m";
      return (meters / 1000).toFixed(2) + " km";
    }

    function bearingDeg(a, b) {
      const φ1 = a.lat * Math.PI / 180;
      const φ2 = b.lat * Math.PI / 180;
      const Δλ = (b.lng - a.lng) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function includedAngle(a, vertex, c) {
      let diff = Math.abs(bearingDeg(vertex, a) - bearingDeg(vertex, c));
      if (diff > 180) diff = 360 - diff;
      return diff;
    }

    function measureTip(latlng, text) {
      L.tooltip({ permanent: true, direction: "center", className: "seg-tip", opacity: 1 })
        .setLatLng(latlng)
        .setContent(text)
        .addTo(measureLayer);
    }

    function refreshMeasure() {
      const angle = measureMode === "angle";
      measureLine.setStyle({ color: angle ? "#0f766e" : "#c2410c" });
      measureLine.setLatLngs(measurePoints);
      measureLayer.clearLayers();
      let total = 0;
      const angles = [];
      measurePoints.forEach((point, i) => {
        L.circleMarker(point, {
          radius: i > 0 && i < measurePoints.length - 1 && angle ? 7 : 5,
          color: angle ? "#0f766e" : "#c2410c",
          fillColor: "#fff",
          fillOpacity: 1,
          weight: 2
        }).addTo(measureLayer);
        if (i === 0) return;
        const prev = measurePoints[i - 1];
        const segment = map.distance(prev, point);
        total += segment;
        const mid = L.latLng((prev.lat + point.lat) / 2, (prev.lng + point.lng) / 2);
        const heading = bearingDeg(prev, point);
        measureTip(mid, angle ? Math.round(heading) + "°" : fmtDist(segment));
        if (angle && i >= 2) {
          const deg = includedAngle(measurePoints[i - 2], prev, point);
          angles.push(deg);
          measureTip(prev, Math.round(deg) + "°");
        }
      });
      const idle = "Bấm “Đo khoảng cách” hoặc “Đo góc”, rồi chọn điểm trên bản đồ.";
      if (!measureMode) {
        $("measureReadout").textContent = measurePoints.length ? "" : idle;
        if (!measurePoints.length) $("measureReadout").textContent = idle;
        return;
      }
      if (angle) {
        if (measurePoints.length < 2) {
          $("measureReadout").textContent = "Bấm điểm đỉnh, rồi hai hướng của góc.";
        } else if (!angles.length) {
          $("measureReadout").textContent = "Hướng " + Math.round(bearingDeg(measurePoints[0], measurePoints[1])) + "°. Bấm điểm thứ ba.";
        } else {
          const last = angles[angles.length - 1];
          $("measureReadout").textContent = "Góc " + last.toFixed(1) + "°"
            + (angles.length > 1 ? " · " + angles.length + " góc" : "");
        }
        return;
      }
      $("measureReadout").textContent = measurePoints.length < 2
        ? "Bấm điểm tiếp theo trên bản đồ."
        : "Tổng " + fmtDist(total) + " · " + measurePoints.length + " điểm";
    }

    function setMeasureMode(mode) {
      measureMode = measureMode === mode ? "" : mode;
      measurePoints.length = 0;
      $("btnMeasure").classList.toggle("on", measureMode === "distance");
      $("btnAngle").classList.toggle("on", measureMode === "angle");
      $("btnMeasure").textContent = measureMode === "distance" ? "Đang đo" : "Đo khoảng cách";
      $("btnAngle").textContent = measureMode === "angle" ? "Đang đo góc" : "Đo góc";
      map.getContainer().style.cursor = measureMode ? "crosshair" : "";
      if (measureMode) map.doubleClickZoom.disable();
      else map.doubleClickZoom.enable();
      refreshMeasure();
    }

    $("btnMeasure").onclick = () => setMeasureMode("distance");
    $("btnAngle").onclick = () => setMeasureMode("angle");
    $("btnClearMeasure").onclick = () => {
      measurePoints.length = 0;
      refreshMeasure();
    };
    map.on("click", (event) => {
      if (!measureMode) return;
      const target = event.originalEvent && event.originalEvent.target;
      if (target && target.closest && target.closest(".leaflet-marker-icon, .marker-cluster")) return;
      measurePoints.push(event.latlng);
      refreshMeasure();
    });

    let users = [];
    let markers = new Map();
    let fitted = false;
    let selected = null;

    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function num(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }
    function ago(ms) {
      if (!ms) return "chưa cập nhật";
      const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
      if (s < 60) return s + " giây trước";
      if (s < 3600) return Math.floor(s / 60) + " phút trước";
      if (s < 86400) return Math.floor(s / 3600) + " giờ trước";
      return Math.floor(s / 86400) + " ngày trước";
    }

    function mapUser(id, raw) {
      const u = raw || {};
      const net = u.networkinfo || {};
      const loc = net.currentLocation || {};
      const updated = Number(net.timestamp) || 0;
      const lat = num(loc.latitude);
      const lng = num(loc.longitude);
      return {
        id,
        name: u.username || u.deviceName || "Chưa đặt tên",
        phone: u.phone || "",
        platform: u.platform || "",
        network: [net.networkName, net.networkType].filter(Boolean).join(" · "),
        lat, lng,
        located: lat != null && lng != null && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 && !(lat === 0 && lng === 0),
        updated,
        online: updated > 0 && (Date.now() - updated) <= ONLINE_MS,
        net,
        cell: net.cellInfo || {},
        sig: net.signalInfo || {},
        station: net.stationCoords || {}
      };
    }

    function field(obj, key) {
      if (!obj || obj[key] === undefined || obj[key] === null || obj[key] === "") return null;
      const n = Number(obj[key]);
      if (Number.isFinite(n)) return n === 2147483647 ? null : n;
      return obj[key];
    }

    function popRow(label, value, unit) {
      if (value === null || value === undefined || value === "") return "";
      return `<div class="row"><span>${label}</span><b>${esc(value)}${unit || ""}</b></div>`;
    }

    function visible(u) {
      const f = $("filter").value;
      if (f === "located" && !u.located) return false;
      if (f === "online" && !u.online) return false;
      if (f === "missing" && u.located) return false;
      const q = $("q").value.trim().toLowerCase();
      if (!q) return true;
      return [u.name, u.phone, u.platform, u.network, u.id].join(" ").toLowerCase().includes(q);
    }

    function popup(u) {
      const cell = u.cell || {};
      const sig = u.sig || {};
      const st = u.station || {};
      const net = u.net || {};
      const tech = field(cell, "technology") || field(sig, "technology") || "";
      const nsa = String(net.networkType || "").includes("5G") || field(sig, "ssRsrp") != null
        || field(cell, "connectionType") === "5G NSA";
      const node = field(cell, "gNodeBId") ?? field(cell, "eNodeBId") ?? field(cell, "rncId");
      const nodeLabel = field(cell, "gNodeBId") != null ? "gNodeB" : field(cell, "eNodeBId") != null ? "eNodeB" : "Node";
      const channel = field(cell, "nrarfcn") ?? field(cell, "earfcn") ?? field(cell, "uarfcn") ?? field(cell, "arfcn");
      const channelLabel = field(cell, "nrarfcn") != null ? "NRARFCN" : field(cell, "earfcn") != null ? "EARFCN" : field(cell, "uarfcn") != null ? "UARFCN" : "ARFCN";
      const pci = field(cell, "pci") ?? field(cell, "psc");
      const pciLabel = field(cell, "psc") != null && field(cell, "pci") == null ? "PSC" : "PCI";
      const area = field(cell, "tac") ?? field(cell, "lac");
      const areaLabel = field(cell, "tac") != null ? "TAC" : "LAC";
      const slat = field(st, "lat");
      const slng = field(st, "long");
      let distance = null;
      if (u.located && slat != null && slng != null) {
        const meters = map.distance([u.lat, u.lng], [slat, slng]);
        distance = meters < 1000 ? Math.round(meters) + " m" : (meters / 1000).toFixed(2) + " km";
      }
      const when = u.updated
        ? new Date(u.updated).toLocaleString("vi-VN", { hour12: false }) + " · " + ago(u.updated)
        : "—";
      const stationText = net.stationInfo ? `<div class="station">${esc(net.stationInfo)}</div>` : "";
      const idBlock = [
        popRow("Cell", field(cell, "technologyDetail") || tech),
        popRow(nodeLabel, node),
        popRow("Cell ID", field(cell, "cellId")),
        popRow("CID / NCI", field(cell, "nci") ?? field(cell, "cid")),
        popRow(areaLabel, area),
        popRow(pciLabel, pci),
        popRow("MCC / MNC", (field(cell, "mcc") != null && field(cell, "mnc") != null) ? field(cell, "mcc") + " / " + field(cell, "mnc") : null)
      ].join("");
      const freqBlock = [
        popRow(channelLabel, channel),
        popRow("DL", field(cell, "dlFrequency"), " MHz"),
        popRow("UL", field(cell, "ulFrequency"), " MHz"),
        popRow("BW", field(sig, "bandwidth"), " MHz")
      ].join("");
      const antBlock = [
        popRow("Distance", distance),
        popRow("Azimuth", field(st, "azimuth"), "°"),
        popRow("Tilt", field(st, "tilt"), "°"),
        popRow("Height", field(st, "height"), " m")
      ].join("");
      const sigBlock = [
        popRow("SS-RSRP", field(sig, "ssRsrp"), " dBm"),
        popRow("SS-RSRQ", field(sig, "ssRsrq"), " dB"),
        popRow("SS-SINR", field(sig, "ssSinr"), " dB"),
        popRow(nsa ? "RSRP anchor" : "RSRP", field(sig, "rsrp"), " dBm"),
        popRow(nsa ? "RSRQ anchor" : "RSRQ", field(sig, "rsrq"), " dB"),
        popRow(nsa ? "SNR anchor" : "SNR", field(sig, "snr"), " dB"),
        popRow("RSCP", field(sig, "rscp"), " dBm"),
        popRow("Ec/No", field(sig, "ecno"), " dB"),
        popRow("Rx Level", field(sig, "rxLevel"), " dBm"),
        popRow("RSSI", field(sig, "rssi"), " dBm"),
        popRow("CQI", field(sig, "cqi")),
        popRow("TA", field(sig, "timingAdvance"))
      ].join("");
      const section = (title, body) => body ? `<div class="sec">${title}</div>${body}` : "";
      return `<div class="user-pop">
        <h3>${esc(u.name)}</h3>
        <div class="row"><span>${u.online ? "Online" : "Offline"} · ${esc(u.platform || "—")}</span><b>${esc(u.phone || "")}</b></div>
        ${section("Vị trí", popRow("Lat / Long", u.located ? u.lat.toFixed(6) + ", " + u.lng.toFixed(6) : null) + popRow("Accuracy", field(net.currentLocation, "accuracy") != null ? Math.round(field(net.currentLocation, "accuracy")) : null, " m") + popRow("Time", when))}
        ${section("Mạng", popRow("Network", u.network) + popRow("Service", field(net, "serviceState")) + popRow("Data", field(net, "dataState")) + popRow("DL", field(net, "dlBitrate"), " kbps") + popRow("UL", field(net, "ulBitrate"), " kbps") + stationText)}
        ${section("Cell", idBlock)}
        ${section("Tần số", freqBlock)}
        ${section("Anten", antBlock)}
        ${section("Tín hiệu", sigBlock)}
      </div>`;
    }

    function pinIcon(online) {
      return L.divIcon({
        className: "",
        iconSize: [16, 16],
        iconAnchor: [8, 8],
        popupAnchor: [0, -10],
        html: `<div class="pin" style="background:${online ? "#067647" : "#98a2b3"}"></div>`
      });
    }

    function refreshOpenPopup(marker, html) {
      const popup = marker.getPopup();
      const content = popup && popup.getElement() && popup.getElement().querySelector(".leaflet-popup-content");
      const top = content ? content.scrollTop : 0;
      const open = marker.isPopupOpen();
      marker.setPopupContent(html);
      if (open && !marker.isPopupOpen()) marker.openPopup();
      const next = marker.getPopup() && marker.getPopup().getElement();
      const scroller = next && next.querySelector(".leaflet-popup-content");
      if (scroller) scroller.scrollTop = top;
    }

    function draw() {
      const shown = users.filter(visible);
      $("nAll").textContent = users.length;
      $("nOn").textContent = users.filter((u) => u.online).length;
      $("nMap").textContent = users.filter((u) => u.located).length;
      const keep = new Set();
      const bounds = [];
      users.filter((u) => u.located).forEach((u) => {
        keep.add(u.id);
        const html = popup(u);
        let marker = markers.get(u.id);
        if (!marker) {
          marker = L.marker([u.lat, u.lng], { icon: pinIcon(u.online), title: u.name });
          marker.bindPopup(html, { maxWidth: 360, minWidth: 260, autoPan: true });
          marker.on("click", () => {
            selected = u.id;
            showUserDetail(users.find((x) => x.id === u.id) || u);
            renderList();
          });
          markers.set(u.id, marker);
          cluster.addLayer(marker);
        } else {
          marker.setLatLng([u.lat, u.lng]);
          marker.setIcon(pinIcon(u.online));
          marker.options.title = u.name;
          refreshOpenPopup(marker, html);
        }
        bounds.push([u.lat, u.lng]);
      });
      [...markers.keys()].forEach((id) => {
        if (keep.has(id)) return;
        cluster.removeLayer(markers.get(id));
        markers.delete(id);
      });
      if (!fitted && bounds.length) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
        fitted = true;
      }
      renderList(shown);
    }

    function showUserDetail(u) {
      const box = $("detail");
      if (!u) { box.classList.remove("show"); box.innerHTML = ""; return; }
      const top = box.scrollTop;
      box.classList.add("show");
      box.innerHTML = popup(u);
      box.scrollTop = top;
    }

    function renderList(shown) {
      const list = shown || users.filter(visible);
      const box = $("list");
      if (!list.length) {
        box.innerHTML = '<div class="empty">Không có user khớp bộ lọc.</div>';
        return;
      }
      const top = box.scrollTop;
      box.innerHTML = list.map((u) => `
        <button class="user ${u.id === selected ? "active" : ""}" data-id="${esc(u.id)}">
          <b><i class="dot ${u.online ? "on" : "off"}"></i>${esc(u.name)}</b>
          <span>${esc(u.network || "Chưa có mạng")} · ${u.located ? esc(ago(u.updated)) : "chưa có GPS"}</span>
        </button>`).join("");
      box.scrollTop = top;
    }

    $("list").onclick = (e) => {
      const btn = e.target.closest("button[data-id]");
      if (!btn) return;
      selected = btn.dataset.id;
      const u = users.find((x) => x.id === selected);
      showUserDetail(u);
      renderList();
      if (!u || !u.located) return;
      const marker = markers.get(u.id);
      map.flyTo([u.lat, u.lng], Math.max(map.getZoom(), 14), { duration: 0.6 });
      if (marker) {
        cluster.zoomToShowLayer(marker, () => marker.openPopup());
      }
    };
    $("q").oninput = draw;
    $("filter").onchange = draw;

    onValue(ref(getDatabase(app), "users"), (snap) => {
      const val = snap.val() || {};
      users = Object.keys(val).map((id) => mapUser(id, val[id]));
      users.sort((a, b) => (b.online - a.online) || (b.updated - a.updated) || a.name.localeCompare(b.name));
      draw();
      if (selected) showUserDetail(users.find((u) => u.id === selected) || null);
    }, (err) => {
      $("list").innerHTML = '<div class="empty">Không đọc được user: ' + esc(err.message) + "</div>";
    });

    setInterval(() => {
      let changed = false;
      users.forEach((u) => {
        const online = u.updated > 0 && (Date.now() - u.updated) <= ONLINE_MS;
        if (online !== u.online) { u.online = online; changed = true; }
      });
      if (changed) draw();
    }, 5000);
  </script>
</body>
</html>
