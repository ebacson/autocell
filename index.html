<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCell — Bản đồ user</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    :root { --ink: #1c2430; --muted: #667085; --line: #e6eaf0; --online: #067647; --offline: #98a2b3; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
    header {
      height: 52px;
      background: #0e3b2e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 12px;
    }
    header strong { font-size: 16px; }
    header .right { display: flex; align-items: center; gap: 14px; }
    nav { display: flex; gap: 14px; align-items: center; }
    nav a { color: #d7efe4; text-decoration: none; font-size: 14px; font-weight: 600; }
    nav a[aria-current] { color: #fff; }
    .auth-box { display: flex; align-items: center; gap: 8px; }
    .auth-box .who { font-size: 13px; color: #d7efe4; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .auth-box button {
      border: 1px solid #3d6b59; background: transparent; color: #d7efe4;
      border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 650; cursor: pointer;
    }
    #wrap { height: calc(100% - 52px); display: flex; }
    aside {
      width: 320px;
      border-right: 1px solid var(--line);
      background: #fff;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .tools { padding: 10px; border-bottom: 1px solid var(--line); }
    .tools input, .tools select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .counts { display: flex; gap: 8px; font-size: 12px; color: var(--muted); }
    .counts b { color: var(--ink); }
    .tech-filters { display: flex; gap: 6px; margin-bottom: 8px; }
    .tech-filters label {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px;
      font-size: 13px; font-weight: 700; cursor: pointer; background: #fff;
    }
    .tech-filters label.off { color: var(--muted); font-weight: 500; background: #f8fafc; }
    .tech-filters i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .leaflet-control-tools {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,.35);
      padding: 5px 6px;
      max-width: 280px;
    }
    .leaflet-control-tools .measure-row {
      display: flex; flex-direction: row; flex-wrap: wrap; gap: 4px;
    }
    .leaflet-control-tools button {
      border: 1px solid var(--line); background: #fff; border-radius: 4px;
      padding: 4px 7px; cursor: pointer; font-size: 11px; line-height: 1.2;
      white-space: nowrap; width: auto; flex: 0 0 auto;
    }
    .leaflet-control-tools button.on { background: #c2410c; color: #fff; border-color: #c2410c; }
    .leaflet-control-tools #btnClearMap {
      border-color: #fecdca; background: #fff5f5; color: #b42318; font-weight: 650;
    }
    .leaflet-control-tools #measureReadout {
      margin-top: 4px; font-size: 10px; color: var(--muted); line-height: 1.25;
      max-width: 260px;
    }
    .seg-tip {
      background: #fff7ed; border: 1px solid #fdba74; color: #9a3412;
      font-weight: 700; box-shadow: none;
    }
    .station-dot { width: 9px; height: 9px; background: #1d4ed8; border: 1.5px solid #fff; transform: rotate(45deg); }
    .station-dot.serving {
      width: 12px; height: 12px; background: #1565c0; border: 2px solid #fff;
      box-shadow: 0 0 0 2px rgba(66, 165, 245, 0.9);
    }
    .station-cluster {
      width: 28px; height: 28px; line-height: 26px; text-align: center; border-radius: 50%;
      background: #1d4ed8; color: #fff; border: 2px solid #fff; font-size: 11px; font-weight: 700;
    }
    #list { overflow: auto; flex: 1; min-height: 80px; }
    .user {
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #fff;
      padding: 10px 12px;
      cursor: pointer;
    }
    .user:hover, .user.active { background: #f3faf6; }
    .user b { display: block; font-size: 14px; }
    .user span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .on { background: var(--online); }
    .off { background: var(--offline); }
    #map { flex: 1; min-width: 0; background: #e7eef2; }
    .pin {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    .leaflet-popup-content { margin: 6px 8px; }
    .user-pop { font-size: 11px; line-height: 1.25; }
    .user-pop h3 { margin: 0 0 1px; font-size: 12px; }
    .user-pop .sec { margin: 4px 0 1px; font-size: 10px; font-weight: 700; color: #667085; }
    .user-pop .row { display: flex; justify-content: space-between; gap: 8px; }
    .site-pop, .cell-pop { font-size: 12px; line-height: 1.3; }
    .site-pop b, .cell-pop b { font-size: 13px; }
    .user-pop .row span { color: #667085; }
    .user-pop .station { white-space: pre-wrap; margin-top: 2px; }
    .empty { padding: 16px; color: var(--muted); font-size: 13px; }
    @media (max-width: 800px) {
      #wrap { flex-direction: column; }
      aside { width: 100%; height: 42%; }
      #map { height: 58%; }
    }
  </style>
</head>
<body>
  <header>
    <strong>AutoCell</strong>
    <div class="right">
      <nav>
        <a href="index.html" aria-current="page">Bản đồ</a>
        <a href="users.html">User</a>
        <a href="about.html">Giới thiệu</a>
        <a href="autocell.apk" download>Tải APK</a>
        <a href="auth.html" id="navLogin">Đăng nhập</a>
      </nav>
      <div class="auth-box" id="authBox" hidden>
        <span class="who" id="authWho"></span>
        <button type="button" id="btnLogout">Đăng xuất</button>
      </div>
    </div>
  </header>
  <div id="wrap">
    <aside>
      <div class="tools">
        <div class="tech-filters">
          <label data-tech="3G"><input type="checkbox" data-tech="3G" checked> <i style="background:#4CAF50"></i>3G</label>
          <label data-tech="4G"><input type="checkbox" data-tech="4G" checked> <i style="background:#2196F3"></i>4G</label>
          <label data-tech="5G"><input type="checkbox" data-tech="5G" checked> <i style="background:#9C27B0"></i>5G</label>
        </div>
        <input id="q" placeholder="Tìm user, mạng, thiết bị…">
        <select id="filter">
          <option value="located">Có vị trí</option>
          <option value="online">Online</option>
          <option value="all">Tất cả</option>
          <option value="missing">Chưa có GPS</option>
        </select>
        <div class="counts">
          <span>Trên bản đồ <b id="nMap">0</b></span>
          <span>Online <b id="nOn">0</b></span>
          <span>Tổng <b id="nAll">0</b></span>
          <span>Trạm <b id="nStations">…</b></span>
        </div>
      </div>
      <div id="list"><div class="empty">Đang tải user…</div></div>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module">
    import { ref, onValue, get } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
    import { db, requireAuth, logout } from "./js/auth.js";

    const ONLINE_MS = 30000;
    const MIN_ROUTE_M = 5;
    const MAX_ROUTE_POINTS = 2000;
    const ROUTE_STORE_KEY = "autocellRoutePoints.v1";
    const $ = (id) => document.getElementById(id);

    document.getElementById("wrap").hidden = true;
    $("btnLogout").onclick = () => {
      document.getElementById("wrap").hidden = true;
      logout("auth.html");
    };
    const map = L.map("map").setView([16.2, 107.8], 6);
    // OSM public tiles often block browsers (x-blocked); use Carto Voyager (OSM data).
    const streetLayer = L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
      {
        maxZoom: 20,
        subdomains: "abcd",
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }
    );
    const satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution: "Tiles &copy; Esri"
      }
    );
    streetLayer.addTo(map);
    L.control.layers(
      { "Đường phố": streetLayer, "Vệ tinh": satelliteLayer },
      null,
      { position: "topright", collapsed: false }
    ).addTo(map);

    requireAuth((user) => {
      $("navLogin").hidden = true;
      $("authBox").hidden = false;
      $("authWho").textContent = user.displayName || user.email || "User";
      $("authWho").title = user.email || "";
      document.getElementById("wrap").hidden = false;
      setTimeout(() => map.invalidateSize(), 0);
    });

    const MapTools = L.Control.extend({
      options: { position: "bottomright" },
      onAdd() {
        const box = L.DomUtil.create("div", "leaflet-control leaflet-control-tools");
        box.innerHTML = `
          <div class="measure-row">
            <button id="btnMeasure" type="button">Khoảng cách</button>
            <button id="btnAngle" type="button">Góc</button>
            <button id="btnClearMeasure" type="button">Xóa đo</button>
            <button id="btnClearMap" type="button">Clear</button>
          </div>
          <div id="measureReadout">Chọn Khoảng cách hoặc Góc.</div>`;
        L.DomEvent.disableClickPropagation(box);
        L.DomEvent.disableScrollPropagation(box);
        return box;
      }
    });
    map.addControl(new MapTools());

    const routeLayer = L.layerGroup().addTo(map);
    const routes = new Map(); // userId -> { points: [{lat,lng,dbm,t,html,marker}] }
    const cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 42 });
    map.addLayer(cluster);
    const stationCluster = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 48,
      iconCreateFunction: (c) => L.divIcon({
        className: "",
        iconSize: [28, 28],
        html: `<div class="station-cluster">${c.getChildCount()}</div>`
      })
    });
    const sectorLayer = L.layerGroup().addTo(map);
    map.addLayer(stationCluster);
    const stationIcon = L.divIcon({
      className: "", iconSize: [12, 12], iconAnchor: [6, 6],
      html: `<div class="station-dot"></div>`
    });
    let stations = [];
    let lastServingSig = "";
    const techOn = { "3G": true, "4G": true, "5G": true };
    let measureMode = "";

    function techVisible(tech) {
      return techOn[tech] !== false;
    }

    function parseCellLabel(name) {
      const raw = String(name || "");
      const cellMatch = raw.match(/[A-Za-z]{3}\d{3}[A-Za-z]\d{2}/);
      const cellCode = cellMatch ? cellMatch[0].toUpperCase() : raw;
      const cshtMatch = raw.match(/_([A-Za-z]{2,4})_(\d{5})(?=_|$)/);
      const csht = cshtMatch ? cshtMatch[2] : "";
      let station = "";
      if (cshtMatch) station = raw.slice(cshtMatch.index + cshtMatch[0].length);
      station = station.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim();
      const hadCell = cellCode && station.toUpperCase().includes(cellCode);
      station = station.replace(/^(2G|3G|4G|5G|NB)\s+/i, "");
      if (cellCode) station = station.replace(new RegExp("\\b" + cellCode + "\\b", "i"), " ");
      station = station.replace(/\b[A-Za-z]{3}\d{3}[A-Za-z]\d{2}\b/g, " ").replace(/\s+/g, " ").trim();
      if (hadCell) station = station.replace(/(?:^|\s+)[A-Za-z]{2,4}$/, "").trim();
      if (!station || (!/\s/.test(station) && !/[A-Za-z]{4,}/.test(station))) station = "";
      return { cellCode, csht, station };
    }

    function techColor(tech) {
      if (tech === "5G") return "#9C27B0";
      if (tech === "4G") return "#2196F3";
      if (tech === "3G") return "#4CAF50";
      return "#808080";
    }

    // Giống MapFragment Android: 5G dài nhất, rồi 4G, 3G (base 100 m × 0.8^(priority-1)).
    function azimuthLineLength(tech) {
      const t = String(tech || "").toUpperCase();
      let priority = 5;
      if (t.includes("5G") || t === "NR") priority = 1;
      else if (t.includes("4G") || t.includes("LTE")) priority = 2;
      else if (t.includes("3G") || t.includes("WCDMA")) priority = 3;
      else if (t.includes("2G") || t.includes("GSM")) priority = 4;
      return 100 * Math.pow(0.8, priority - 1);
    }

    function destination(lat, lng, meters, bearingDeg) {
      const R = 6378137;
      const δ = meters / R;
      const θ = bearingDeg * Math.PI / 180;
      const φ1 = lat * Math.PI / 180;
      const λ1 = lng * Math.PI / 180;
      const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
      const λ2 = λ1 + Math.atan2(
        Math.sin(θ) * Math.sin(δ) * Math.cos(φ1),
        Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2)
      );
      return [φ2 * 180 / Math.PI, λ2 * 180 / Math.PI];
    }

    // Giống MapFragment Android: rfar từ tilt/height, clamp 100–500 m; chỉ vẽ 1 vùng (không rnear).
    function sectorRadius(tilt, height) {
      const ha = height > 0 ? height : 30;
      const hu = 1.5;
      const hpbwHalf = 5 * Math.PI / 180;
      const tiltRad = (Number.isFinite(tilt) ? tilt : 0) * Math.PI / 180;
      const angleFar = tiltRad - hpbwHalf;
      let rfar = 2000;
      if (angleFar > 0 && angleFar < Math.PI / 2) {
        rfar = (ha - hu) / Math.tan(angleFar);
      }
      return Math.max(100, Math.min(rfar, 500));
    }

    function sectorRing(lat, lng, azimuth, radius, sweep) {
      const half = sweep / 2;
      const start = azimuth - half;
      const end = azimuth + half;
      const pts = [[lat, lng]];
      for (let deg = start; deg <= end; deg += 2) {
        pts.push(destination(lat, lng, radius, deg));
      }
      pts.push([lat, lng]);
      return pts;
    }

    function azDiff(a, b) {
      return Math.min(Math.abs(a - b) % 360, 360 - (Math.abs(a - b) % 360));
    }

    function siteKey(lat, lng) {
      return Number(lat).toFixed(5) + "," + Number(lng).toFixed(5);
    }

    // Serving cell của user online (networkinfo.stationCoords), kiểu MapFragment Android.
    function collectServing() {
      const bySite = new Map();
      (typeof users !== "undefined" ? users : []).forEach((u) => {
        if (!u.online) return;
        const st = u.station || {};
        const lat = num(st.lat);
        const lng = num(st.long);
        if (lat == null || lng == null) return;
        const key = siteKey(lat, lng);
        const list = bySite.get(key) || [];
        list.push({
          lat, lng,
          azimuth: Number.isFinite(Number(st.azimuth)) ? Number(st.azimuth) : 0,
          tilt: num(st.tilt),
          height: num(st.height),
          user: u.name
        });
        bySite.set(key, list);
      });
      return bySite;
    }

    function servingMatch(servings, azimuth) {
      if (!servings || !servings.length) return null;
      let best = null;
      servings.forEach((s) => {
        const d = azDiff(s.azimuth, azimuth);
        if (d <= 5 && (!best || d < best.diff)) best = { serving: s, diff: d };
      });
      return best && best.serving;
    }

    function cellPopupHtml(cell, serving) {
      return `<div class="cell-pop">` +
        (serving ? `<div style="color:#1565c0;font-weight:700">Serving · ${esc(serving.user)}</div>` : "") +
        `<div>${esc(cell.tech || "—")}</div>` +
        `<b>${esc(cell.name)}</b>` +
        `<div>Azimuth ${Number.isFinite(cell.azimuth) ? cell.azimuth + "°" : "—"}</div>` +
        `<div>Tilt ${cell.tilt != null ? cell.tilt : "—"}</div>` +
        `<div>H ${cell.height != null ? cell.height + " m" : "—"}</div>` +
        `</div>`;
    }

    // Serving kiểu radar: đậm ở gốc, mờ dần ra xa và hai mép; không viền.
    function addServingSector(lat, lng, azimuth, tilt, height, popupHtml) {
      const radius = sectorRadius(tilt, height);
      const sweep = 60;
      const half = sweep / 2;
      const angStep = 3;
      const radSteps = 8;
      const group = L.layerGroup();

      for (let a0 = -half; a0 < half - 0.001; a0 += angStep) {
        const a1 = Math.min(a0 + angStep, half);
        const amid = (a0 + a1) / 2;
        const sideFade = Math.pow(Math.max(0, 1 - Math.abs(amid) / half), 1.15);
        for (let i = 0; i < radSteps; i++) {
          const r0 = (radius * i) / radSteps;
          const r1 = (radius * (i + 1)) / radSteps;
          const radialFade = Math.pow(1 - (i + 0.5) / radSteps, 0.85);
          const opacity = Math.min(1, 0.35 + 0.65 * sideFade * radialFade);
          if (opacity < 0.05) continue;
          const ring = r0 < 1
            ? [
                [lat, lng],
                destination(lat, lng, r1, azimuth + a0),
                destination(lat, lng, r1, azimuth + a1)
              ]
            : [
                destination(lat, lng, r0, azimuth + a0),
                destination(lat, lng, r0, azimuth + a1),
                destination(lat, lng, r1, azimuth + a1),
                destination(lat, lng, r1, azimuth + a0)
              ];
          L.polygon(ring, {
            stroke: false,
            fillColor: "#42A5F5",
            fillOpacity: opacity,
            interactive: false,
            bubblingMouseEvents: false
          }).addTo(group);
        }
      }

      const hit = L.polygon(sectorRing(lat, lng, azimuth, radius, sweep), {
        stroke: false,
        fillColor: "#42A5F5",
        fillOpacity: 0.01,
        interactive: !measureMode,
        bubblingMouseEvents: false
      });
      hit.bindPopup(popupHtml);
      hit.addTo(group);
      group.addTo(sectorLayer);
      return group;
    }

    function addAzimuthLine(lat, lng, azimuth, tech, popupHtml) {
      const end = destination(lat, lng, azimuthLineLength(tech), azimuth);
      const line = L.polyline([[lat, lng], end], {
        color: techColor(tech),
        weight: 4,
        opacity: 0.85,
        interactive: !measureMode,
        bubblingMouseEvents: false
      });
      line.bindPopup(popupHtml);
      line.addTo(sectorLayer);
      return line;
    }

    function redrawSectors() {
      sectorLayer.clearLayers();
      if (map.getZoom() < 13) return;
      const bounds = map.getBounds().pad(0.2);
      const servingBySite = collectServing();
      const matchedServing = new Set();

      stations.forEach((site) => {
        if (!bounds.contains([site.lat, site.lng])) return;
        const servings = servingBySite.get(siteKey(site.lat, site.lng));
        site.cells.forEach((cell) => {
          if (!techVisible(cell.tech)) return;
          const serving = servingMatch(servings, cell.azimuth);
          if (serving) {
            matchedServing.add(serving);
            addServingSector(
              site.lat, site.lng,
              serving.azimuth || cell.azimuth,
              serving.tilt != null ? serving.tilt : cell.tilt,
              serving.height != null ? serving.height : cell.height,
              cellPopupHtml(cell, serving)
            );
          } else {
            addAzimuthLine(site.lat, site.lng, cell.azimuth, cell.tech, cellPopupHtml(cell, null));
          }
        });
      });

      // Serving chưa khớp celldata: vẫn vẽ cánh sóng theo tilt/height.
      servingBySite.forEach((list) => {
        list.forEach((s) => {
          if (matchedServing.has(s)) return;
          if (!bounds.contains([s.lat, s.lng])) return;
          addServingSector(
            s.lat, s.lng, s.azimuth, s.tilt, s.height,
            `<div class="cell-pop"><div style="color:#1565c0;font-weight:700">Serving · ${esc(s.user)}</div>` +
            `<div>Azimuth ${s.azimuth}°</div>` +
            `<div>Tilt ${s.tilt != null ? s.tilt : "—"}</div>` +
            `<div>H ${s.height != null ? s.height + " m" : "—"}</div></div>`
          );
        });
      });
    }

    function loadStations(raw) {
      const groups = new Map();
      Object.entries(raw || {}).forEach(([id, cell]) => {
        if (!cell || typeof cell !== "object") return;
        const lat = Number(cell.lat);
        const lng = Number(cell.long);
        if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return;
        if (lat === 0 && lng === 0) return;
        const key = lat.toFixed(5) + "," + lng.toFixed(5);
        let site = groups.get(key);
        if (!site) {
          site = { lat, lng, node: cell.node || "", cells: [] };
          groups.set(key, site);
        }
        if (cell.node) site.node = String(cell.node);
        const label = parseCellLabel(cell.cellname || id);
        const tilt = Number(cell.tilt);
        const height = Number(cell.height);
        site.cells.push({
          name: label.cellCode,
          tech: cell.tech || "",
          azimuth: Number.isFinite(Number(cell.azimuth)) ? Number(cell.azimuth) : 0,
          tilt: Number.isFinite(tilt) ? tilt : null,
          height: Number.isFinite(height) ? height : null,
          csht: label.csht,
          station: label.station
        });
      });
      stations = [...groups.values()];
      stations.forEach((site) => {
        const names = site.cells.map((c) => c.station).filter(Boolean);
        site.stationName = names.sort((a, b) => b.length - a.length)[0]
          || (site.cells.find((c) => c.name.length >= 6) || {}).name?.slice(0, 6)
          || site.node
          || "Trạm";
        site.csht = [...new Set(site.cells.map((c) => c.csht).filter(Boolean))].join(", ");
      });
      $("nStations").textContent = stations.length;
      paintStations();
    }

    function paintStations() {
      const servingBySite = collectServing();
      stationCluster.clearLayers();
      stations.forEach((site) => {
        const servings = servingBySite.get(siteKey(site.lat, site.lng));
        const isServing = !!(servings && servings.length);
        if (!isServing && !site.cells.some((c) => techVisible(c.tech))) return;
        const icon = isServing
          ? L.divIcon({
              className: "", iconSize: [14, 14], iconAnchor: [7, 7],
              html: `<div class="station-dot serving"></div>`
            })
          : stationIcon;
        const marker = L.marker([site.lat, site.lng], {
          icon,
          title: isServing ? "Serving · " + site.stationName : site.stationName,
          zIndexOffset: isServing ? 400 : -200
        });
        const serveLine = isServing
          ? `<br><span style="color:#1565c0;font-weight:700">Serving · ${esc(servings.map((s) => s.user).join(", "))}</span>`
          : "";
        marker.bindPopup(
          `<div class="site-pop"><b>${esc(site.stationName)}</b><br>CSHT ${esc(site.csht || "—")}${serveLine}</div>`
        );
        stationCluster.addLayer(marker);
      });
      redrawSectors();
    }

    document.querySelectorAll(".tech-filters input").forEach((input) => {
      input.onchange = () => {
        techOn[input.dataset.tech] = input.checked;
        input.parentElement.classList.toggle("off", !input.checked);
        paintStations();
      };
    });
    map.on("moveend zoomend", redrawSectors);
    get(ref(db, "celldata")).then((snap) => loadStations(snap.val() || {}))
      .catch((err) => { $("nStations").textContent = "lỗi"; console.warn(err); });

    const measurePoints = [];
    const measureLine = L.polyline([], { color: "#c2410c", weight: 3, interactive: false }).addTo(map);
    const measureLayer = L.layerGroup().addTo(map);

    function fmtDist(meters) {
      if (meters < 1000) return Math.round(meters) + " m";
      return (meters / 1000).toFixed(2) + " km";
    }

    function bearingDeg(a, b) {
      const φ1 = a.lat * Math.PI / 180;
      const φ2 = b.lat * Math.PI / 180;
      const Δλ = (b.lng - a.lng) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function includedAngle(a, vertex, c) {
      let diff = Math.abs(bearingDeg(vertex, a) - bearingDeg(vertex, c));
      if (diff > 180) diff = 360 - diff;
      return diff;
    }

    function measureTip(latlng, text) {
      L.tooltip({ permanent: true, direction: "center", className: "seg-tip", opacity: 1 })
        .setLatLng(latlng)
        .setContent(text)
        .addTo(measureLayer);
    }

    function refreshMeasure() {
      const angle = measureMode === "angle";
      measureLine.setStyle({ color: angle ? "#0f766e" : "#c2410c" });
      measureLine.setLatLngs(measurePoints);
      measureLayer.clearLayers();
      let total = 0;
      const angles = [];
      measurePoints.forEach((point, i) => {
        L.circleMarker(point, {
          radius: i > 0 && i < measurePoints.length - 1 && angle ? 7 : 5,
          color: angle ? "#0f766e" : "#c2410c",
          fillColor: "#fff",
          fillOpacity: 1,
          weight: 2
        }).addTo(measureLayer);
        if (i === 0) return;
        const prev = measurePoints[i - 1];
        const segment = map.distance(prev, point);
        total += segment;
        const mid = L.latLng((prev.lat + point.lat) / 2, (prev.lng + point.lng) / 2);
        const heading = bearingDeg(prev, point);
        measureTip(mid, angle ? Math.round(heading) + "°" : fmtDist(segment));
        if (angle && i >= 2) {
          const deg = includedAngle(measurePoints[i - 2], prev, point);
          angles.push(deg);
          measureTip(prev, Math.round(deg) + "°");
        }
      });
      const idle = "Chọn Khoảng cách hoặc Góc, rồi bấm điểm trên map.";
      if (!measureMode) {
        $("measureReadout").textContent = measurePoints.length ? "" : idle;
        if (!measurePoints.length) $("measureReadout").textContent = idle;
        return;
      }
      if (angle) {
        if (measurePoints.length < 2) {
          $("measureReadout").textContent = "Bấm điểm đỉnh, rồi hai hướng của góc.";
        } else if (!angles.length) {
          $("measureReadout").textContent = "Hướng " + Math.round(bearingDeg(measurePoints[0], measurePoints[1])) + "°. Bấm điểm thứ ba.";
        } else {
          const last = angles[angles.length - 1];
          $("measureReadout").textContent = "Góc " + last.toFixed(1) + "°"
            + (angles.length > 1 ? " · " + angles.length + " góc" : "");
        }
        return;
      }
      $("measureReadout").textContent = measurePoints.length < 2
        ? "Bấm điểm tiếp theo trên bản đồ."
        : "Tổng " + fmtDist(total) + " · " + measurePoints.length + " điểm";
    }

    function setMeasureMode(mode) {
      measureMode = measureMode === mode ? "" : mode;
      measurePoints.length = 0;
      $("btnMeasure").classList.toggle("on", measureMode === "distance");
      $("btnAngle").classList.toggle("on", measureMode === "angle");
      $("btnMeasure").textContent = measureMode === "distance" ? "Đang đo" : "Khoảng cách";
      $("btnAngle").textContent = measureMode === "angle" ? "Đang đo góc" : "Góc";
      map.getContainer().style.cursor = measureMode ? "crosshair" : "";
      if (measureMode) map.doubleClickZoom.disable();
      else map.doubleClickZoom.enable();
      refreshMeasure();
      redrawSectors();
    }

    $("btnMeasure").onclick = () => setMeasureMode("distance");
    $("btnAngle").onclick = () => setMeasureMode("angle");
    $("btnClearMeasure").onclick = () => {
      measurePoints.length = 0;
      refreshMeasure();
    };
    map.on("click", (event) => {
      if (!measureMode) return;
      const target = event.originalEvent && event.originalEvent.target;
      if (target && target.closest && target.closest(".leaflet-marker-icon, .marker-cluster")) return;
      measurePoints.push(event.latlng);
      refreshMeasure();
    });

    let users = [];
    let markers = new Map();
    let fitted = false;
    let selected = null;

    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function num(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }
    function ago(ms) {
      if (!ms) return "chưa cập nhật";
      const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
      if (s < 60) return s + " giây trước";
      if (s < 3600) return Math.floor(s / 60) + " phút trước";
      if (s < 86400) return Math.floor(s / 3600) + " giờ trước";
      return Math.floor(s / 86400) + " ngày trước";
    }

    function mapUser(id, raw) {
      const u = raw || {};
      const net = u.networkinfo || {};
      const loc = net.currentLocation || {};
      const updated = Number(net.timestamp) || 0;
      const lat = num(loc.latitude);
      const lng = num(loc.longitude);
      return {
        id,
        name: u.username || u.deviceName || "Chưa đặt tên",
        phone: u.phone || "",
        platform: u.platform || "",
        network: [net.networkName, net.networkType].filter(Boolean).join(" · "),
        lat, lng,
        located: lat != null && lng != null && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 && !(lat === 0 && lng === 0),
        updated,
        online: updated > 0 && (Date.now() - updated) <= ONLINE_MS,
        net,
        cell: net.cellInfo || {},
        sig: net.signalInfo || {},
        station: net.stationCoords || {}
      };
    }

    function field(obj, key) {
      if (!obj || obj[key] === undefined || obj[key] === null || obj[key] === "") return null;
      const n = Number(obj[key]);
      if (Number.isFinite(n)) return n === 2147483647 ? null : n;
      return obj[key];
    }

    function popRow(label, value, unit) {
      if (value === null || value === undefined || value === "") return "";
      return `<div class="row"><span>${label}</span><b>${esc(value)}${unit || ""}</b></div>`;
    }

    function visible(u) {
      const f = $("filter").value;
      if (f === "located" && !u.located) return false;
      if (f === "online" && !u.online) return false;
      if (f === "missing" && u.located) return false;
      const q = $("q").value.trim().toLowerCase();
      if (!q) return true;
      return [u.name, u.phone, u.platform, u.network, u.id].join(" ").toLowerCase().includes(q);
    }

    function popup(u) {
      const cell = u.cell || {};
      const sig = u.sig || {};
      const st = u.station || {};
      const net = u.net || {};
      const tech = field(cell, "technology") || field(sig, "technology") || "";
      const nsa = String(net.networkType || "").includes("5G") || field(sig, "ssRsrp") != null
        || field(cell, "connectionType") === "5G NSA";
      const node = field(cell, "gNodeBId") ?? field(cell, "eNodeBId") ?? field(cell, "rncId");
      const nodeLabel = field(cell, "gNodeBId") != null ? "gNodeB" : field(cell, "eNodeBId") != null ? "eNodeB" : "Node";
      const channel = field(cell, "nrarfcn") ?? field(cell, "earfcn") ?? field(cell, "uarfcn") ?? field(cell, "arfcn");
      const channelLabel = field(cell, "nrarfcn") != null ? "NRARFCN" : field(cell, "earfcn") != null ? "EARFCN" : field(cell, "uarfcn") != null ? "UARFCN" : "ARFCN";
      const pci = field(cell, "pci") ?? field(cell, "psc");
      const pciLabel = field(cell, "psc") != null && field(cell, "pci") == null ? "PSC" : "PCI";
      const area = field(cell, "tac") ?? field(cell, "lac");
      const areaLabel = field(cell, "tac") != null ? "TAC" : "LAC";
      const slat = field(st, "lat");
      const slng = field(st, "long");
      let distance = null;
      if (u.located && slat != null && slng != null) {
        const meters = map.distance([u.lat, u.lng], [slat, slng]);
        distance = meters < 1000 ? Math.round(meters) + " m" : (meters / 1000).toFixed(2) + " km";
      }
      const when = u.updated
        ? new Date(u.updated).toLocaleString("vi-VN", { hour12: false }) + " · " + ago(u.updated)
        : "—";
      const stationText = net.stationInfo ? `<div class="station">${esc(net.stationInfo)}</div>` : "";
      const idBlock = [
        popRow("Cell", field(cell, "technologyDetail") || tech),
        popRow(nodeLabel, node),
        popRow("Cell ID", field(cell, "cellId")),
        popRow("CID / NCI", field(cell, "nci") ?? field(cell, "cid")),
        popRow(areaLabel, area),
        popRow(pciLabel, pci),
        popRow("MCC / MNC", (field(cell, "mcc") != null && field(cell, "mnc") != null) ? field(cell, "mcc") + " / " + field(cell, "mnc") : null)
      ].join("");
      const freqBlock = [
        popRow(channelLabel, channel),
        popRow("DL", field(cell, "dlFrequency"), " MHz"),
        popRow("UL", field(cell, "ulFrequency"), " MHz"),
        popRow("BW", field(sig, "bandwidth"), " MHz")
      ].join("");
      const antBlock = [
        popRow("Distance", distance),
        popRow("Azimuth", field(st, "azimuth"), "°"),
        popRow("Tilt", field(st, "tilt"), "°"),
        popRow("Height", field(st, "height"), " m")
      ].join("");
      const sigBlock = [
        popRow("SS-RSRP", field(sig, "ssRsrp"), " dBm"),
        popRow("SS-RSRQ", field(sig, "ssRsrq"), " dB"),
        popRow("SS-SINR", field(sig, "ssSinr"), " dB"),
        popRow(nsa ? "RSRP anchor" : "RSRP", field(sig, "rsrp"), " dBm"),
        popRow(nsa ? "RSRQ anchor" : "RSRQ", field(sig, "rsrq"), " dB"),
        popRow(nsa ? "SNR anchor" : "SNR", field(sig, "snr"), " dB"),
        popRow("RSCP", field(sig, "rscp"), " dBm"),
        popRow("Ec/No", field(sig, "ecno"), " dB"),
        popRow("Rx Level", field(sig, "rxLevel"), " dBm"),
        popRow("RSSI", field(sig, "rssi"), " dBm"),
        popRow("CQI", field(sig, "cqi")),
        popRow("TA", field(sig, "timingAdvance"))
      ].join("");
      const section = (title, body) => body ? `<div class="sec">${title}</div>${body}` : "";
      return `<div class="user-pop">
        <h3>${esc(u.name)}</h3>
        <div class="row"><span>${u.online ? "Online" : "Offline"} · ${esc(u.platform || "—")}</span><b>${esc(u.phone || "")}</b></div>
        ${section("Vị trí", popRow("Lat / Long", u.located ? u.lat.toFixed(6) + ", " + u.lng.toFixed(6) : null) + popRow("Accuracy", field(net.currentLocation, "accuracy") != null ? Math.round(field(net.currentLocation, "accuracy")) : null, " m") + popRow("Time", when))}
        ${section("Mạng", popRow("Network", u.network) + popRow("Service", field(net, "serviceState")) + popRow("Data", field(net, "dataState")) + popRow("DL", field(net, "dlBitrate"), " kbps") + popRow("UL", field(net, "ulBitrate"), " kbps") + stationText)}
        ${section("Cell", idBlock)}
        ${section("Tần số", freqBlock)}
        ${section("Anten", antBlock)}
        ${section("Tín hiệu", sigBlock)}
      </div>`;
    }

    function pinIcon(online) {
      return L.divIcon({
        className: "",
        iconSize: [16, 16],
        iconAnchor: [8, 8],
        popupAnchor: [0, -10],
        html: `<div class="pin" style="background:${online ? "#067647" : "#98a2b3"}"></div>`
      });
    }

    function signalForColor(u) {
      const sig = u.sig || {};
      return field(sig, "ssRsrp") ?? field(sig, "rsrp") ?? field(sig, "rscp") ?? field(sig, "rxLevel");
    }

    // Giống SignalColorUtils Android: Excellent/Good/Fair/Poor/Very Poor.
    function signalColor(dbm) {
      if (dbm == null) return "#808080";
      if (dbm >= -70) return "#0064ff";
      if (dbm >= -90) return "#00c853";
      if (dbm >= -100) return "#ffeb3b";
      if (dbm >= -110) return "#ffa500";
      return "#f44336";
    }

    function routePopupHtml(point) {
      return `<div class="user-pop">
        <h3>${esc(point.name || "Điểm đo")}</h3>
        <div class="sec">Điểm đo</div>
        ${popRow("Time", point.when)}
        ${popRow("Lat / Long", point.lat.toFixed(6) + ", " + point.lng.toFixed(6))}
        ${popRow("Network", point.network)}
        ${popRow("Signal", point.dbm, " dBm")}
        ${popRow("SS-RSRP", point.ssRsrp, " dBm")}
        ${popRow("RSRP", point.rsrp, " dBm")}
        ${popRow("RSRQ", point.rsrq, " dB")}
        ${popRow("SINR", point.sinr, " dB")}
        ${popRow("RSCP", point.rscp, " dBm")}
        ${popRow("Cell", point.cellName)}
      </div>`;
    }

    function snapshotRoutePoint(u, dbm) {
      const sig = u.sig || {};
      const cell = u.cell || {};
      const when = u.updated
        ? new Date(u.updated).toLocaleString("vi-VN", { hour12: false })
        : "—";
      return {
        lat: u.lat,
        lng: u.lng,
        dbm,
        t: u.updated || Date.now(),
        when,
        name: u.name,
        network: u.network,
        ssRsrp: field(sig, "ssRsrp"),
        rsrp: field(sig, "rsrp"),
        rsrq: field(sig, "ssRsrq") ?? field(sig, "rsrq"),
        sinr: field(sig, "ssSinr") ?? field(sig, "snr"),
        rscp: field(sig, "rscp"),
        cellName: field(cell, "technologyDetail") || field(cell, "technology") || ""
      };
    }

    function addRouteMarker(track, point) {
      const marker = L.circleMarker([point.lat, point.lng], {
        radius: 5,
        color: "#ffffff",
        weight: 1,
        fillColor: signalColor(point.dbm),
        fillOpacity: 0.95,
        interactive: true
      });
      marker.bindPopup(routePopupHtml(point), { maxWidth: 300, minWidth: 200 });
      marker.addTo(track.layer);
      point.marker = marker;
      track.points.push(point);
      while (track.points.length > MAX_ROUTE_POINTS) {
        const old = track.points.shift();
        if (old.marker) track.layer.removeLayer(old.marker);
      }
    }

    function ensureRouteTrack(userId) {
      let track = routes.get(userId);
      if (!track) {
        track = { points: [], layer: L.layerGroup().addTo(routeLayer) };
        routes.set(userId, track);
      }
      return track;
    }

    function maybeAddRoutePoint(u) {
      if (!u.located) return;
      const dbm = signalForColor(u);
      if (dbm == null) return;
      const track = ensureRouteTrack(u.id);
      const last = track.points[track.points.length - 1];
      if (last) {
        const dist = map.distance([last.lat, last.lng], [u.lat, u.lng]);
        if (dist < 1) return;
        if (dist < MIN_ROUTE_M && last.dbm === dbm) return;
        if (last.t && u.updated && u.updated <= last.t && dist < MIN_ROUTE_M) return;
      }
      addRouteMarker(track, snapshotRoutePoint(u, dbm));
      scheduleSaveRoutes();
    }

    let saveRoutesTimer = 0;
    function scheduleSaveRoutes() {
      clearTimeout(saveRoutesTimer);
      saveRoutesTimer = setTimeout(saveRoutes, 800);
    }

    function saveRoutes() {
      try {
        const data = {};
        routes.forEach((track, id) => {
          data[id] = track.points.map((p) => ({
            lat: p.lat, lng: p.lng, dbm: p.dbm, t: p.t, when: p.when,
            name: p.name, network: p.network,
            ssRsrp: p.ssRsrp, rsrp: p.rsrp, rsrq: p.rsrq, sinr: p.sinr,
            rscp: p.rscp, cellName: p.cellName
          }));
        });
        localStorage.setItem(ROUTE_STORE_KEY, JSON.stringify(data));
      } catch (err) {
        console.warn(err);
      }
    }

    function loadRoutes() {
      try {
        const raw = JSON.parse(localStorage.getItem(ROUTE_STORE_KEY) || "{}");
        Object.entries(raw).forEach(([id, list]) => {
          if (!Array.isArray(list) || !list.length) return;
          const track = ensureRouteTrack(id);
          list.forEach((p) => {
            if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return;
            addRouteMarker(track, p);
          });
        });
      } catch (err) {
        console.warn(err);
      }
    }

    function clearRoutes() {
      routes.forEach((track) => {
        track.layer.clearLayers();
        map.removeLayer(track.layer);
      });
      routes.clear();
      localStorage.removeItem(ROUTE_STORE_KEY);
    }

    $("btnClearMap").onclick = () => {
      const count = [...routes.values()].reduce((n, t) => n + t.points.length, 0);
      if (!count) return;
      if (!confirm("Clear map — xóa " + count + " điểm đo?")) return;
      clearRoutes();
    };
    loadRoutes();

    function refreshOpenPopup(marker, html) {
      const popup = marker.getPopup();
      const content = popup && popup.getElement() && popup.getElement().querySelector(".leaflet-popup-content");
      const top = content ? content.scrollTop : 0;
      const open = marker.isPopupOpen();
      marker.setPopupContent(html);
      if (open && !marker.isPopupOpen()) marker.openPopup();
      const next = marker.getPopup() && marker.getPopup().getElement();
      const scroller = next && next.querySelector(".leaflet-popup-content");
      if (scroller) scroller.scrollTop = top;
    }

    function draw() {
      const shown = users.filter(visible);
      $("nAll").textContent = users.length;
      $("nOn").textContent = users.filter((u) => u.online).length;
      $("nMap").textContent = users.filter((u) => u.located).length;
      const keep = new Set();
      const bounds = [];
      users.filter((u) => u.located).forEach((u) => {
        keep.add(u.id);
        maybeAddRoutePoint(u);
        const html = popup(u);
        let marker = markers.get(u.id);
        if (!marker) {
          marker = L.marker([u.lat, u.lng], { icon: pinIcon(u.online), title: u.name });
          marker.bindPopup(html, { maxWidth: 360, minWidth: 260, autoPan: true });
          marker.on("click", () => {
            selected = u.id;
            renderList();
          });
          markers.set(u.id, marker);
          cluster.addLayer(marker);
        } else {
          marker.setLatLng([u.lat, u.lng]);
          marker.setIcon(pinIcon(u.online));
          marker.options.title = u.name;
          refreshOpenPopup(marker, html);
        }
        bounds.push([u.lat, u.lng]);
      });
      [...markers.keys()].forEach((id) => {
        if (keep.has(id)) return;
        cluster.removeLayer(markers.get(id));
        markers.delete(id);
      });
      if (!fitted && bounds.length) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
        fitted = true;
      }
      renderList(shown);
      const serveSig = [...collectServing().entries()]
        .map(([k, list]) => k + ":" + list.map((s) => s.azimuth).join("/"))
        .sort()
        .join("|");
      if (serveSig !== lastServingSig) {
        lastServingSig = serveSig;
        if (stations.length) paintStations();
      } else {
        redrawSectors();
      }
    }

    function renderList(shown) {
      const list = shown || users.filter(visible);
      const box = $("list");
      if (!list.length) {
        box.innerHTML = '<div class="empty">Không có user khớp bộ lọc.</div>';
        return;
      }
      const top = box.scrollTop;
      box.innerHTML = list.map((u) => `
        <button class="user ${u.id === selected ? "active" : ""}" data-id="${esc(u.id)}">
          <b><i class="dot ${u.online ? "on" : "off"}"></i>${esc(u.name)}</b>
          <span>${esc(u.network || "Chưa có mạng")} · ${u.located ? esc(ago(u.updated)) : "chưa có GPS"}</span>
        </button>`).join("");
      box.scrollTop = top;
    }

    function focusUserAndServing(u) {
      if (!u || !u.located) return;
      const pts = [[u.lat, u.lng]];
      const st = u.station || {};
      const slat = field(st, "lat");
      const slng = field(st, "long");
      if (slat != null && slng != null) {
        pts.push([slat, slng]);
        const az = Number(st.azimuth);
        const tilt = num(st.tilt);
        const height = num(st.height);
        if (Number.isFinite(az)) {
          const r = sectorRadius(tilt, height);
          pts.push(destination(slat, slng, r, az));
          pts.push(destination(slat, slng, r, az - 30));
          pts.push(destination(slat, slng, r, az + 30));
        }
      }
      if (pts.length === 1) {
        map.flyTo(pts[0], Math.max(map.getZoom(), 14), { duration: 0.6 });
        return;
      }
      map.flyToBounds(pts, { padding: [56, 56], maxZoom: 16, duration: 0.7 });
    }

    $("list").onclick = (e) => {
      const btn = e.target.closest("button[data-id]");
      if (!btn) return;
      selected = btn.dataset.id;
      const u = users.find((x) => x.id === selected);
      renderList();
      focusUserAndServing(u);
    };
    $("q").oninput = draw;
    $("filter").onchange = draw;

    onValue(ref(db, "users"), (snap) => {
      const val = snap.val() || {};
      users = Object.keys(val).map((id) => mapUser(id, val[id]));
      users.sort((a, b) => (b.online - a.online) || (b.updated - a.updated) || a.name.localeCompare(b.name));
      draw();
    }, (err) => {
      $("list").innerHTML = '<div class="empty">Không đọc được user: ' + esc(err.message) + "</div>";
    });

    setInterval(() => {
      let changed = false;
      users.forEach((u) => {
        const online = u.updated > 0 && (Date.now() - u.updated) <= ONLINE_MS;
        if (online !== u.online) { u.online = online; changed = true; }
      });
      if (changed) draw();
    }, 5000);
  </script>
</body>
</html>
