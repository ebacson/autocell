<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCell — Liên hệ</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    :root {
      --bg: #f4f6f8;
      --ink: #1c2430;
      --muted: #667085;
      --line: #e6eaf0;
      --primary: #0b6e4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    header {
      background: #0e3b2e;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header strong { font-size: 16px; }
    nav { display: flex; gap: 14px; }
    nav a { color: #d7efe4; text-decoration: none; font-size: 13px; font-weight: 650; }
    nav a[aria-current] { color: #fff; }
    main { max-width: 520px; margin: 0 auto; padding: 40px 20px 48px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .lead { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 16px;
    }
    .row {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 6px 12px;
      font-size: 15px;
      margin: 0;
    }
    .row dt { color: var(--muted); }
    .row dd { margin: 0; font-weight: 650; }
    .row a { color: var(--primary); text-decoration: none; font-weight: 650; }
    .row a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <strong>AutoCell</strong>
    <nav>
      <a href="index.html">Bản đồ</a>
      <a href="users.html">User</a>
      <a href="auth.html">Đăng nhập</a>
      <a href="autocell.apk" download>Tải APK</a>
      <a href="about.html" aria-current="page">Liên hệ</a>
    </nav>
  </header>
  <main>
    <h1>Hỗ trợ &amp; liên hệ</h1>
    <p class="lead">Liên hệ khi cần hỗ trợ AutoCell.</p>
    <div class="card">
      <dl class="row">
        <dt>Người hỗ trợ</dt>
        <dd>Tạ Bắc Sơn</dd>
        <dt>Email</dt>
        <dd><a href="mailto:ebacson@gmail.com">ebacson@gmail.com</a></dd>
        <dt>Điện thoại</dt>
        <dd><a href="tel:0913485889">0913485889</a></dd>
      </dl>
    </div>
  </main>
</body>
</html>
